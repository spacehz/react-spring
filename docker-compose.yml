version: '3'
services:
  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: P@ssw0rd
      MYSQL_USER: product_user
      MYSQL_PASSWORD: product_user_password
      MYSQL_DATABASE: product

  spring-boot-app:
      build:
        context: ./backend
        dockerfile: Dockerfile
      # ports:
      #   - "8080:8080"
      depends_on:
        - mysql
      environment:
        SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/product
        SPRING_DATASOURCE_USERNAME: product_user
        SPRING_DATASOURCE_PASSWORD: product_user_password
      restart: unless-stopped



  react-app:
      build:
        context: ./frontend
        dockerfile: Dockerfile
        args:
          REACT_APP_API_BASE_URL: http://localhost:3000
      # environment:
      #   REACT_APP_API_BASE_URL: http://spring-boot-app:8080
      ports:
        - "3000:80"
