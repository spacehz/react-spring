apiVersion: v1
kind: Service
metadata:
  name: react-service
  namespace: product-app
  labels:
    app: product-app
    component: react
spec:
  type: NodePort
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30000
    protocol: TCP
    name: http
  selector:
    app: product-app
    component: react
