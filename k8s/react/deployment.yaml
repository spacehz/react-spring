apiVersion: apps/v1
kind: Deployment
metadata:
  name: react-app
  namespace: product-app
  labels:
    app: product-app
    component: react
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: product-app
      component: react
  template:
    metadata:
      labels:
        app: product-app
        component: react
        version: v1
    spec:
      containers:
      - name: react
        image: product-frontend:v1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
