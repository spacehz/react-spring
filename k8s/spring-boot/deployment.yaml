apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-boot-app
  namespace: product-app
  labels:
    app: product-app
    component: spring-boot
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: product-app
      component: spring-boot
  template:
    metadata:
      labels:
        app: product-app
        component: spring-boot
        version: v1
    spec:
      containers:
      - name: spring-boot
        image: product-backend:v1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: SPRING_DATASOURCE_URL
          value: jdbc:mysql://mysql:3306/product
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: mysql-user
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: mysql-password
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /api/products
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/products
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
